name: Apply reviewed homepage cleanup

on:
  push:
    branches: [remove-template-content]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'whwu07/whwu07.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-template-content
          fetch-depth: 2
      - name: Apply the reviewed file changes
        run: |
          python3 - <<'PY'
          import base64, gzip, json, subprocess
          from pathlib import Path
          expected = "0f8ec3c00d96188e4a71e2d497cfeb890701de03"
          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          assert parent == expected, "The source branch changed; review before applying cleanup"
          changes = json.loads(gzip.decompress(base64.b64decode("")))
          root = Path.cwd().resolve()
          def target(rel):
              path = root / rel
              assert not Path(rel).is_absolute() and ".." not in Path(rel).parts
              assert path.parent.resolve().is_relative_to(root)
              assert not rel.startswith(".github/workflows/")
              return path
          for rel in changes["remove"]:
              target(rel).unlink()
          for rel, content in changes["write"].items():
              path = target(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8", newline="\n")
          print(f"Removed {len(changes['remove'])} template files and updated {len(changes['write'])} files")
          PY
      - name: Commit to the cleanup branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused template content and personalize site maintenance"
          git push origin HEAD:remove-template-content
